name: University Management System - Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required by dorny/test-reporter to publish check results
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:

  # ════════════════════════════════════════════════════════════
  #  JOB 1 — Unit Tests
  # ════════════════════════════════════════════════════════════
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit Tests
        run: mvn clean test -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true -Dtest="StudentControllerUnitTest,TeacherControllerUnitTest,UserDetailsServiceUnitTest"

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Unit Test Results"
          path: "target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload Unit Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — Integration Tests
  # ════════════════════════════════════════════════════════════
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Integration Tests
        run: mvn clean test -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true -Dtest="StudentRegistrationIntegrationTest,TeacherRegistrationIntegrationTest,UserLoginIntegrationTest"

      - name: Publish Integration Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Integration Test Results"
          path: "target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload Integration Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  #  JOB 3 — All Tests Summary (runs after both jobs complete)
  # ════════════════════════════════════════════════════════════
  all-tests-summary:
    name: "All Tests Summary"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run ALL Tests
        run: mvn clean test -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true

      - name: Publish Full Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "All Tests - Full Report"
          path: "target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload Full Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-reports
          path: target/surefire-reports/
          retention-days: 7
